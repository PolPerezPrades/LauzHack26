[project]
name = "lauzhack26"
version = "0.1.0"
description = "MX Brio live perception: hands, pose, face identity, gaze"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.2.0",                 # Apache-2.0: hands/gestures, pose, face mesh + iris
    "opencv-contrib-python==4.14.0.94", # Apache-2.0: capture, drawing, SFace face recognition
    "onnxruntime==1.31.1",              # MIT: runs the MobileGaze gaze model
    "numpy>=2,<2.6",
]

[tool.uv]
package = false
# Only resolve releases that have been public for a while (supply-chain hygiene).
exclude-newer = "2026-11-07T00:00:00Z"
